# The merge path that works without a laptop and without the cloud proxy.
#
# A cloud routine cannot merge here: this repo disables repo-level auto-merge
# and requires a merge queue, so the only way in is the GraphQL mutation
# `enqueuePullRequest`, and GraphQL is blocked by the cloud proxy. A GitHub
# Actions job runs inside GitHub, so no proxy sits between it and the API --
# and it can already see the checks it is gating on.
#
# THIS SHIPS DISABLED, TWICE OVER:
#   1. It never fires on its own for real work. There is no `schedule`, no
#      `pull_request` and no `workflow_run` trigger. It runs only when a human
#      dispatches it, or on a push to a `cloud/**` branch, which is where this
#      package is being built and nowhere else.
#   2. `scripts/lwb_auto_queue.py` refuses to enqueue unless the repository
#      variable `LWB_AUTO_QUEUE` is exactly `armed`. That variable does not
#      exist, so the mutation is unreachable.
#
# Turning it on is two deliberate owner actions -- create the variable, and add
# the real triggers listed in `docs/cloud/runbook.md` -- taken after an audit,
# not as a side effect of merging this branch.
name: lwb-auto-queue

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate (blank = probe only)"
        required: false
        default: ""
  push:
    branches:
      - 'cloud/**'

# Read-only by design while disabled. The armed path needs
# `pull-requests: write`; it is requested here so that the run log records
# exactly which permissions GitHub actually grants, which the repository's
# `default_workflow_permissions` setting can silently cap.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lwb-auto-queue-${{ github.event.inputs.pr || github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checks out the ref that fired this workflow, which is safe ONLY
      # because this workflow has no pull-request trigger: `workflow_dispatch`
      # and `push` both run code a collaborator pushed, and GitHub takes the
      # workflow definition from that same ref.
      #
      # READ THIS BEFORE ADDING A TRIGGER. The moment a `pull_request`,
      # `pull_request_target` or `workflow_run` trigger is added, the checked
      # out code becomes pull-request-controlled while this job holds a
      # write-scoped token. At that point pin the checkout to
      # `ref: ${{ github.event.repository.default_branch }}`. The job never
      # needs a PR's code in any case: it reads a PR's proof and review
      # records as JSON data over the API, and JSON data is not executed.
      #
      # The first attempt at this file DID pin the default branch, and the run
      # failed with "can't open file .../scripts/lwb_auto_queue.py" because
      # the script is not on `main` yet. That failure is why this comment
      # exists rather than a silent assumption.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe what this runner can reach
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lwb_auto_queue.py --probe

      - name: Decide (dry run unless LWB_AUTO_QUEUE is armed)
        if: ${{ github.event.inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LWB_AUTO_QUEUE: ${{ vars.LWB_AUTO_QUEUE }}
        run: python scripts/lwb_auto_queue.py --pr "${{ github.event.inputs.pr }}"
