name: Auto-queue

# Lands a ready pull request WITHOUT A HUMAN'S LAPTOP.
#
# BuildCraft's ruleset requires the merge queue and auto-merge is disabled, so the only
# way to land a PR is the GraphQL mutation `enqueuePullRequest`. A cloud routine cannot
# call it: GraphQL is blocked by the cloud proxy (measured by LEAPWare-ShellUX,
# 2026-09-19). Until this workflow existed, a cloud routine could do all the work and
# then be unable to finish it -- the one dependency tying this product to one machine.
#
# GitHub Actions has no such problem: it runs inside GitHub, so nothing is proxied.
# See D27 in docs/requirements/decisions.md.
#
# THE DECISION LIVES IN scripts/cloud/auto_queue.py, not here, so it is testable.
# Readiness is simply "every required check is green", because this repository's gates
# already encode readiness: `lwb-lanes` fails without a valid independent review record,
# and `lwb-proof-pr` fails without a proof record. Parsing reviewer comments would add a
# second, weaker source of truth that could disagree with the first.
#
# EVERY TRIGGER RUNS THE DEFAULT BRANCH'S CODE, never the pull request's -- a PR must
# never be able to edit the job that decides whether it may merge.

on:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to consider
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-queue-${{ github.event.inputs.pr_number || github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  queue:
    name: "Enqueue when every required check is green"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch only. None of these triggers may run pull request code.
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the pull requests this event concerns
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          manual = (event.get("inputs") or {}).get("pr_number")
          if manual:
              print(f"prs={manual}")
          else:
              prs = [str(p["number"]) for p in (event.get("check_suite") or {}).get("pull_requests") or []]
              print("prs=" + ",".join(prs))
          PY

      # THE BUILT-IN TOKEN CANNOT LAND A PULL REQUEST HERE, and the failure
      # is silent. An enqueue made as `github-actions[bot]` does start the
      # queue entry, but GitHub does not start workflow runs for events
      # triggered by the built-in token -- so the merge_group checks never
      # run and the pull request sits in the queue forever, green, looking
      # like nothing is happening rather than like something failed.
      #
      # Measured by LEAPWare-ShellUX on their PR #194, 2026-09-19. Their fix
      # is a classic repo-scope PAT in an Actions secret, with NO FALLBACK to
      # the built-in token. Corroborated here from the other direction: PR #27
      # merged through this repository's queue at 14:18Z the same day, and the
      # queue's own CI ran -- that enqueue was made by hand with a human token.
      #
      # A fallback to `github.token` would be the exact defect this repository
      # keeps shipping: a path that cannot work, reporting the same success as
      # one that does. So the secret is REQUIRED, and its absence fails loudly.
      - name: Require the AUTO_TOKEN_QUEUE secret
        if: steps.find.outputs.prs != ''
        env:
          AUTO_TOKEN_QUEUE: ${{ secrets.AUTO_TOKEN_QUEUE }}
        run: |
          if [ -z "$AUTO_TOKEN_QUEUE" ]; then
            echo "::error::AUTO_TOKEN_QUEUE is not set. The built-in GITHUB_TOKEN"
            echo "::error::cannot start the merge_group checks, so an enqueue made"
            echo "::error::with it leaves the pull request stalled in the queue."
            echo "::error::Create a classic repo-scope token and add it as the"
            echo "::error::Actions secret AUTO_TOKEN_QUEUE. There is no fallback"
            echo "::error::on purpose: a path that cannot work must not report"
            echo "::error::the same success as one that can."
            exit 1
          fi
          echo "AUTO_TOKEN_QUEUE is present."

      - name: Enqueue if ready
        if: steps.find.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.AUTO_TOKEN_QUEUE }}
        run: |
          for pr in $(echo "${{ steps.find.outputs.prs }}" | tr ',' ' '); do
            echo "::group::PR #$pr"
            LWB_PR_NUMBER="$pr" python scripts/cloud/auto_queue.py
            echo "::endgroup::"
          done
